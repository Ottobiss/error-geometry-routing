<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Inter, Arial, sans-serif">
  <rect id="background" width="1000" height="960" fill="#FFFFFF"/>

  <g id="title">
    <text x="40" y="56" font-size="26" font-weight="600" fill="#1F2328">Решение роутера на кадр</text>
  </g>

  <g id="step input">
    <rect x="350" y="100" width="300" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="500" y="124" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">Новый кадр</text>
    <text x="500" y="144" font-size="13" fill="#0F6E56" text-anchor="middle">flag = knn, priority = entropy</text>
  </g>

  <g id="step credit in">
    <rect x="350" y="188" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="500" y="212" font-size="16" font-weight="600" fill="#0C447C" text-anchor="middle">Кредит += budget</text>
    <text x="500" y="232" font-size="13" fill="#185FA5" text-anchor="middle">не выше потолка 2.0</text>
  </g>

  <g id="decision flag">
    <polygon points="500,276 650,330 500,384 350,330" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="500" y="335" font-size="16" font-weight="600" fill="#0C447C" text-anchor="middle">flag &gt; порог?</text>
  </g>
  <g id="flag yes">
    <rect x="702" y="296" width="260" height="68" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="832" y="324" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle">Базовый: ens@0.75</text>
    <text x="832" y="346" font-size="13" fill="#993C1D" text-anchor="middle">или ens@0.5 / light по кредиту</text>
  </g>
  <g id="flag no">
    <rect x="40" y="302" width="258" height="56" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="169" y="336" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Базовый: light</text>
  </g>

  <g id="step share">
    <rect x="300" y="470" width="400" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="500" y="498" font-size="16" font-weight="600" fill="#0C447C" text-anchor="middle">Доля кадров для heavy</text>
    <text x="500" y="520" font-size="13" fill="#185FA5" text-anchor="middle">бюджет минус траты на отмеченные, окно 50</text>
  </g>

  <g id="decision priority">
    <polygon points="500,570 700,630 500,690 300,630" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="500" y="625" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">priority в верхней доле окна</text>
    <text x="500" y="645" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">и кредит позволяет?</text>
  </g>
  <g id="priority yes">
    <rect x="752" y="600" width="210" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="857" y="626" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle">heavy</text>
    <text x="857" y="646" font-size="13" fill="#993C1D" text-anchor="middle">полный B5</text>
  </g>
  <g id="priority no">
    <rect x="40" y="600" width="210" height="60" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="145" y="626" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Базовый уровень</text>
    <text x="145" y="646" font-size="13" fill="#57606A" text-anchor="middle">из шага с flag</text>
  </g>

  <g id="step credit out">
    <rect x="350" y="770" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="500" y="794" font-size="16" font-weight="600" fill="#0C447C" text-anchor="middle">Кредит −= стоимость</text>
    <text x="500" y="814" font-size="13" fill="#185FA5" text-anchor="middle">не ниже долга −1</text>
  </g>

  <g id="step run">
    <rect x="350" y="858" width="300" height="56" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="500" y="882" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Запуск уровня</text>
    <text x="500" y="902" font-size="13" fill="#57606A" text-anchor="middle">→ сегментация кадра</text>
  </g>

  <g id="branch labels">
    <text x="676" y="320" font-size="13" fill="#57606A" text-anchor="middle">да</text>
    <text x="324" y="320" font-size="13" fill="#57606A" text-anchor="middle">нет</text>
    <text x="726" y="620" font-size="13" fill="#57606A" text-anchor="middle">да</text>
    <text x="275" y="620" font-size="13" fill="#57606A" text-anchor="middle">нет</text>
  </g>

  <g id="arrows" fill="none" stroke="#57606A" stroke-width="1.5">
    <path d="M500 156 V178"/>
    <path d="M500 244 V266"/>
    <path d="M650 330 H692"/>
    <path d="M350 330 H308"/>
    <path d="M832 364 V440 H169 V358"/>
    <path d="M500 440 V460"/>
    <path d="M500 538 V560"/>
    <path d="M700 630 H742"/>
    <path d="M300 630 H260"/>
    <path d="M857 660 V740 H145 V660"/>
    <path d="M500 740 V760"/>
    <path d="M500 826 V848"/>
  </g>
  <g id="arrowheads" fill="#57606A">
    <polygon points="500,186 495,176 505,176"/>
    <polygon points="500,274 495,264 505,264"/>
    <polygon points="700,330 690,325 690,335"/>
    <polygon points="300,330 310,325 310,335"/>
    <polygon points="500,468 495,458 505,458"/>
    <polygon points="500,568 495,558 505,558"/>
    <polygon points="750,630 740,625 740,635"/>
    <polygon points="252,630 262,625 262,635"/>
    <polygon points="500,768 495,758 505,758"/>
    <polygon points="500,856 495,846 505,846"/>
  </g>
</svg>
