<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="640" viewBox="0 0 1420 640" font-family="Inter, Arial, sans-serif">
  <rect id="background" width="1420" height="640" fill="#FFFFFF"/>

  <g id="title">
    <text x="40" y="56" font-size="26" font-weight="600" fill="#1F2328">Пайплайн маршрутизации</text>
    <text x="40" y="84" font-size="15" fill="#57606A">B0 на каждом кадре, B5 в нужном объёме, средний бюджет 0.5 полного B5 на кадр</text>
  </g>

  <g id="frame">
    <rect x="40" y="306" width="150" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="115" y="334" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Кадр</text>
    <text x="115" y="354" font-size="13" fill="#57606A" text-anchor="middle">RGB, 512 × 1024</text>
  </g>

  <g id="light model B0">
    <rect x="240" y="296" width="190" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="335" y="332" font-size="16" font-weight="600" fill="#3C3489" text-anchor="middle">B0 · лёгкая модель</text>
    <text x="335" y="354" font-size="13" fill="#534AB7" text-anchor="middle">логиты + слой decoder</text>
  </g>

  <g id="feature knn">
    <rect x="490" y="226" width="210" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="595" y="258" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">kNN · flag</text>
    <text x="595" y="280" font-size="13" fill="#0F6E56" text-anchor="middle">непохожесть на чистые</text>
  </g>

  <g id="feature entropy">
    <rect x="490" y="378" width="210" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="595" y="410" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">Энтропия · priority</text>
    <text x="595" y="432" font-size="13" fill="#0F6E56" text-anchor="middle">неуверенность B0</text>
  </g>

  <g id="router">
    <rect x="760" y="296" width="190" height="84" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="855" y="332" font-size="16" font-weight="600" fill="#0C447C" text-anchor="middle">Роутер</text>
    <text x="855" y="354" font-size="13" fill="#185FA5" text-anchor="middle">порог · квантиль · кредит</text>
  </g>

  <g id="state">
    <rect x="760" y="470" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="855" y="498" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">state.pt</text>
    <text x="855" y="518" font-size="13" fill="#57606A" text-anchor="middle">банк kNN · порог</text>
  </g>

  <g id="fit">
    <rect x="490" y="470" width="210" height="64" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="595" y="498" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">fit · чистые кадры</text>
    <text x="595" y="518" font-size="13" fill="#57606A" text-anchor="middle">python main.py fit</text>
  </g>

  <g id="level light">
    <rect x="1010" y="178" width="200" height="60" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="1110" y="204" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">light</text>
    <text x="1110" y="224" font-size="13" fill="#57606A" text-anchor="middle">только B0 · 0</text>
  </g>
  <g id="level ens 0.5">
    <rect x="1010" y="258" width="200" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="1110" y="284" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle">ens@0.5</text>
    <text x="1110" y="304" font-size="13" fill="#993C1D" text-anchor="middle">B0 + B5 на 0.5× · 0.25</text>
  </g>
  <g id="level ens 0.75">
    <rect x="1010" y="338" width="200" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="1110" y="364" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle">ens@0.75</text>
    <text x="1110" y="384" font-size="13" fill="#993C1D" text-anchor="middle">B0 + B5 на 0.75× · 0.56</text>
  </g>
  <g id="level heavy">
    <rect x="1010" y="418" width="200" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="1110" y="444" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle">heavy</text>
    <text x="1110" y="464" font-size="13" fill="#993C1D" text-anchor="middle">B5 на полном кадре · 1</text>
  </g>

  <g id="output">
    <rect x="1260" y="306" width="130" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="1325" y="344" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Сегментация</text>
  </g>

  <g id="arrows" fill="none" stroke="#57606A" stroke-width="1.5">
    <path d="M190 338 H230"/>
    <path d="M430 338 H460 V262 H480"/>
    <path d="M460 338 V414 H480"/>
    <path d="M700 262 H730 V320 H750"/>
    <path d="M700 414 H730 V356 H750"/>
    <path d="M950 338 H980 M980 208 V448 M980 208 H1000 M980 288 H1000 M980 368 H1000 M980 448 H1000"/>
    <path d="M1210 208 H1235 M1210 288 H1235 M1210 368 H1235 M1210 448 H1235 M1235 208 V448 M1235 338 H1250"/>
    <path d="M855 470 V390" stroke-dasharray="6 4"/>
    <path d="M700 502 H750" stroke-dasharray="6 4"/>
  </g>
  <g id="arrowheads" fill="#57606A">
    <polygon points="238,338 228,333 228,343"/>
    <polygon points="488,262 478,257 478,267"/>
    <polygon points="488,414 478,409 478,419"/>
    <polygon points="758,320 748,315 748,325"/>
    <polygon points="758,356 748,351 748,361"/>
    <polygon points="1008,208 998,203 998,213"/>
    <polygon points="1008,288 998,283 998,293"/>
    <polygon points="1008,368 998,363 998,373"/>
    <polygon points="1008,448 998,443 998,453"/>
    <polygon points="1258,338 1248,333 1248,343"/>
    <polygon points="855,382 850,392 860,392"/>
    <polygon points="758,502 748,497 748,507"/>
  </g>

  <g id="legend">
    <rect x="40" y="586" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="64" y="599" font-size="13" fill="#57606A">лёгкая модель</text>
    <rect x="180" y="586" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="204" y="599" font-size="13" fill="#57606A">признаки кадра</text>
    <rect x="330" y="586" width="16" height="16" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="354" y="599" font-size="13" fill="#57606A">роутер</text>
    <rect x="430" y="586" width="16" height="16" rx="4" fill="#FAECE7" stroke="#993C1D"/>
    <text x="454" y="599" font-size="13" fill="#57606A">уровни с тяжёлой моделью (B5); число — стоимость в долях полного B5</text>
    <rect x="1010" y="586" width="16" height="16" rx="4" fill="#F6F8FA" stroke="#8C959F" stroke-dasharray="3 2"/>
    <text x="1034" y="599" font-size="13" fill="#57606A">подгонка, один раз</text>
  </g>
</svg>
