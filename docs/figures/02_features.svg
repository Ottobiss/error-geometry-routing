<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="560" viewBox="0 0 1390 560" font-family="Inter, Arial, sans-serif">
  <rect id="background" width="1390" height="560" fill="#FFFFFF"/>

  <g id="title">
    <text x="40" y="56" font-size="26" font-weight="600" fill="#1F2328">Признаки кадра</text>
    <text x="40" y="84" font-size="15" fill="#57606A">Оба признака берутся из одного прогона B0 и сворачиваются в одно число на кадр</text>
  </g>

  <g id="light model B0">
    <rect x="40" y="140" width="150" height="224" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="115" y="246" font-size="16" font-weight="600" fill="#3C3489" text-anchor="middle">B0</text>
    <text x="115" y="268" font-size="13" fill="#534AB7" text-anchor="middle">один прогон</text>
  </g>

  <g id="lane entropy">
    <text x="230" y="128" font-size="13" font-weight="600" fill="#0F6E56">entropy · priority</text>
    <g id="entropy logits">
      <rect x="230" y="140" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="325" y="168" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Логиты</text>
      <text x="325" y="188" font-size="13" fill="#57606A" text-anchor="middle">19 × 128 × 256</text>
    </g>
    <g id="entropy per point">
      <rect x="460" y="140" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="555" y="168" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">−Σ p · log p</text>
      <text x="555" y="188" font-size="13" fill="#57606A" text-anchor="middle">в каждой точке</text>
    </g>
    <g id="entropy map">
      <rect x="690" y="140" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="785" y="168" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Карта энтропии</text>
      <text x="785" y="188" font-size="13" fill="#57606A" text-anchor="middle">128 × 256</text>
    </g>
    <g id="entropy mean">
      <rect x="1150" y="140" width="200" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
      <text x="1250" y="168" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">Среднее → entropy</text>
      <text x="1250" y="188" font-size="13" fill="#0F6E56" text-anchor="middle">одно число на кадр</text>
    </g>
  </g>

  <g id="lane knn">
    <text x="230" y="288" font-size="13" font-weight="600" fill="#0F6E56">knn · flag</text>
    <g id="knn decoder">
      <rect x="230" y="300" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="325" y="328" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Слой decoder</text>
      <text x="325" y="348" font-size="13" fill="#57606A" text-anchor="middle">256 × 128 × 256</text>
    </g>
    <g id="knn pooling">
      <rect x="460" y="300" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="555" y="328" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Пулинг 2×2 + норма</text>
      <text x="555" y="348" font-size="13" fill="#57606A" text-anchor="middle">8192 вектора × 256</text>
    </g>
    <g id="knn search">
      <rect x="690" y="300" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="785" y="328" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">10 соседей</text>
      <text x="785" y="348" font-size="13" fill="#57606A" text-anchor="middle">косинус, 1 − сходство</text>
    </g>
    <g id="knn map">
      <rect x="920" y="300" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="1015" y="328" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Карта расстояний</text>
      <text x="1015" y="348" font-size="13" fill="#57606A" text-anchor="middle">64 × 128</text>
    </g>
    <g id="knn mean">
      <rect x="1150" y="300" width="200" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
      <text x="1250" y="328" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">Среднее → knn</text>
      <text x="1250" y="348" font-size="13" fill="#0F6E56" text-anchor="middle">одно число на кадр</text>
    </g>
    <g id="knn bank">
      <rect x="690" y="430" width="190" height="64" rx="10" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="785" y="458" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">Банк 20 000</text>
      <text x="785" y="478" font-size="13" fill="#57606A" text-anchor="middle">векторов чистых кадров</text>
    </g>
  </g>

  <g id="arrows" fill="none" stroke="#57606A" stroke-width="1.5">
    <path d="M190 172 H220"/>
    <path d="M420 172 H450"/>
    <path d="M650 172 H680"/>
    <path d="M880 172 H1140"/>
    <path d="M190 332 H220"/>
    <path d="M420 332 H450"/>
    <path d="M650 332 H680"/>
    <path d="M880 332 H910"/>
    <path d="M1110 332 H1140"/>
    <path d="M785 430 V374" stroke-dasharray="6 4"/>
  </g>
  <g id="arrowheads" fill="#57606A">
    <polygon points="228,172 218,167 218,177"/>
    <polygon points="458,172 448,167 448,177"/>
    <polygon points="688,172 678,167 678,177"/>
    <polygon points="1148,172 1138,167 1138,177"/>
    <polygon points="228,332 218,327 218,337"/>
    <polygon points="458,332 448,327 448,337"/>
    <polygon points="688,332 678,327 678,337"/>
    <polygon points="918,332 908,327 908,337"/>
    <polygon points="1148,332 1138,327 1138,337"/>
    <polygon points="785,366 780,376 790,376"/>
  </g>

  <g id="note">
    <text x="920" y="458" font-size="13" fill="#57606A">Банк собирается при fit: по 500 случайных векторов</text>
    <text x="920" y="478" font-size="13" fill="#57606A">с каждого чистого кадра, затем 20 000 случайных.</text>
    <text x="920" y="498" font-size="13" fill="#57606A">Порог knn — 95-й перцентиль на тех же кадрах.</text>
  </g>
</svg>
