<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, Arial, sans-serif">
  <rect id="background" width="1200" height="560" fill="#FFFFFF"/>

  <g id="title">
    <text x="40" y="56" font-size="26" font-weight="600" fill="#1F2328">Кредит бюджета</text>
    <text x="40" y="84" font-size="15" fill="#57606A">Держит среднюю стоимость на кадр около budget, не заглядывая в будущие кадры</text>
  </g>

  <g id="rules">
    <g id="rule income">
      <rect x="40" y="108" width="250" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
      <text x="165" y="133" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">+ budget (0.5) за кадр</text>
    </g>
    <g id="rule spend">
      <rect x="310" y="108" width="300" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
      <text x="460" y="133" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle">− стоимость выбранного уровня</text>
    </g>
    <g id="rule bounds">
      <rect x="630" y="108" width="330" height="40" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="795" y="133" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">потолок 2.0 · долг не ниже −1</text>
    </g>
  </g>

  <g id="axes" font-size="13" fill="#57606A">
    <line x1="120" y1="190" x2="1110" y2="190" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1118" y="194" fill="#993C1D">2.0</text>
    <line x1="120" y1="350" x2="1110" y2="350" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="1118" y="354">0</text>
    <line x1="120" y1="430" x2="1110" y2="430" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1118" y="434">−1</text>
    <text x="40" y="194">потолок</text>
    <text x="40" y="354">кредит</text>
    <text x="40" y="434">долг</text>
  </g>

  <g id="credit line">
    <polyline points="120,350 160,390 240,430 320,390 400,395 480,355 560,315 640,275 720,235 800,195 880,190 960,270 1040,310" fill="none" stroke="#185FA5" stroke-width="2"/>
    <g fill="#185FA5">
      <circle cx="160" cy="390" r="4"/><circle cx="240" cy="430" r="4"/><circle cx="320" cy="390" r="4"/>
      <circle cx="400" cy="395" r="4"/><circle cx="480" cy="355" r="4"/><circle cx="560" cy="315" r="4"/>
      <circle cx="640" cy="275" r="4"/><circle cx="720" cy="235" r="4"/><circle cx="800" cy="195" r="4"/>
      <circle cx="880" cy="190" r="4"/><circle cx="960" cy="270" r="4"/><circle cx="1040" cy="310" r="4"/>
    </g>
  </g>

  <g id="burned">
    <text x="880" y="176" font-size="12" fill="#993C1D" text-anchor="middle">сгорело 0.44</text>
    <text x="960" y="176" font-size="12" fill="#993C1D" text-anchor="middle">сгорело 0.5</text>
  </g>

  <g id="frame levels" font-size="12" text-anchor="middle">
    <text x="160" y="470" fill="#712B13" font-weight="600">heavy</text>
    <text x="240" y="470" fill="#712B13" font-weight="600">heavy</text>
    <text x="320" y="470" fill="#57606A">light</text>
    <text x="400" y="470" fill="#712B13" font-weight="600">ens@0.75</text>
    <text x="480" y="470" fill="#57606A">light</text>
    <text x="560" y="470" fill="#57606A">light</text>
    <text x="640" y="470" fill="#57606A">light</text>
    <text x="720" y="470" fill="#57606A">light</text>
    <text x="800" y="470" fill="#57606A">light</text>
    <text x="880" y="470" fill="#57606A">light</text>
    <text x="960" y="470" fill="#712B13" font-weight="600">heavy</text>
    <text x="1040" y="470" fill="#712B13" font-weight="600">heavy</text>
  </g>
  <g id="frame numbers" font-size="12" fill="#8C959F" text-anchor="middle">
    <text x="160" y="490">1</text><text x="240" y="490">2</text><text x="320" y="490">3</text><text x="400" y="490">4</text>
    <text x="480" y="490">5</text><text x="560" y="490">6</text><text x="640" y="490">7</text><text x="720" y="490">8</text>
    <text x="800" y="490">9</text><text x="880" y="490">10</text><text x="960" y="490">11</text><text x="1040" y="490">12</text>
  </g>

  <g id="caption" font-size="13" fill="#57606A">
    <text x="120" y="530">Кадр 3: heavy увёл бы кредит ниже −1, поэтому light. Кадры 10–11: кредит упёрся в потолок, пополнение сгорает.</text>
  </g>
</svg>
