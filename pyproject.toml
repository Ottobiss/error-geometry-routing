[project]
name = "error-geometry-routing"
version = "0.1.0"
description = "Patch-level error prediction for SegFormer-B0 from SAE codes of Mix-FFN activations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "scipy==1.18.1",
    "numpy==2.5.2",
    "catboost==1.2.10",
    "cityscapesscripts==2.3.0",
    "pillow",
    "requests",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

# torch with CUDA 13.0 (the wheels bundle the runtime; any driver with CUDA ≥ 13.0 works).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
