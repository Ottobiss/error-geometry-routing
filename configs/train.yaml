seed: 0
out: ???                     # set by configs/large.yaml (stage 1) or configs/small.yaml (stage 3)

data:
  root: ???                  # Cityscapes root with leftImg8bit/ and gtFine/
  crop: [512, 1024]          # H, W
  base_size: [2048, 1024]    # W, H for the random resize
  scale_range: [0.5, 2.0]
  batch_size: 8              # total over all GPUs (torchrun splits it between the processes)
  workers: 8                 # total over all GPUs
  large_uncertainty: null    # src.export_uncertainty output: the model also learns the large model's uncertainty
  large_uncertainty_split: val  # its images teach only that (segmentation is learned on train)

model:
  variant: b0                # MiT encoder: b0 | b2
  pretrained: nvidia/segformer-b0-finetuned-cityscapes-1024-1024  # HF hub id or local path; only its last conv trains
  manifold: lorentz          # lorentz | poincare (the paper's; its logits <= 1/sqrt(c) break a frozen network)
  c: 0.7                     # the hyperbolic space has curvature -c
  classifier_scale: 0.2      # class outputs x this before the exp map: where NVIDIA's logits (tens) put the embeddings
  patch: 32                  # uncertainties are averaged over patch x patch pixel squares, 1 = per pixel

loss:
  t: 1.869                   # uncertainty weight 1 / log(t + d), Eq. 11
  hr: 1.0                    # OHUEM: share of the most uncertain labelled pixels of each image in the loss
  class_weights: null        # optional w_k, Eq. 12
  large_unc_weight: 1.0      # weight of the loss between the predicted and the exported large-model uncertainty
  large_unc_loss: bce        # bce | mse | l1; the prediction is always the sigmoid of the extra output

train:
  iters: 2000                # the frozen network changes within the first hundreds; best.pt is chosen by val mIoU
  lr: 1.5e-4                 # of the last decoder conv, the only trained layer: ~0.1% of its weights (~0.15) per step
  weight_decay: 0.01
  warmup: 100
  poly_power: 0.9
  amp: false                 # bf16 autocast

log:
  every: 50
  val_every: 250
  val_images: 3              # validation panels in TensorBoard
